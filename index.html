  };

  var lang = 'zh';
  function pickLang() {
    var q = /[?&]lang=(zh|en)/.exec(location.search);
    if (q) return q[1];
    try { var s = localStorage.getItem('lang'); if (s === 'zh' || s === 'en') return s; } catch (e) {}
    /* 按浏览器语言偏好顺序，第一个能识别的为准；都不认识就用英文 */
    var prefs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || navigator.userLanguage || ''];
    for (var i = 0; i < prefs.length; i++) {
      if (/^zh/i.test(prefs[i])) return 'zh';
      if (/^en/i.test(prefs[i])) return 'en';
    }
    return 'en';
  }
  function T(k, vars) {
    var s = I18N[lang][k]; if (s == null) s = I18N.zh[k]; if (s == null) return k;
    if (vars) for (var n in vars) s = s.split('{' + n + '}').join(vars[n]);
    return s;
  }
  /* 日志里的文字：字符串 或 {zh, en}；没有英文时回退中文 */
  function loc(v) {
    if (v == null) return '';
    if (typeof v === 'string') return v;
    return v[lang] || v.zh || v.en || '';
  }

  function gb(mb) { return (mb / 1000).toFixed(mb >= 10000 ? 0 : 1) + ' GB'; }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function $(id) { return document.getElementById(id); }

  /* ---------- 图片放大 ---------- */
  var lb = $('lightbox');
  function openShot(src, alt, cap) {
    $('lb-img').src = src; $('lb-img').alt = alt || '';
    $('lb-cap').textContent = cap || '';
    lb.classList.add('on'); lb.setAttribute('aria-hidden', 'false');
  }
  function closeShot() { lb.classList.remove('on'); lb.setAttribute('aria-hidden', 'true'); $('lb-img').removeAttribute('src'); }
  lb.addEventListener('click', closeShot);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeShot(); });
  function shot(src, alt, cap) {
    var b = el('button', 'shot'); b.type = 'button';
    var img = el('img'); img.src = src; img.alt = alt || ''; img.loading = 'lazy'; img.decoding = 'async';
    b.appendChild(img);
    b.addEventListener('click', function () { openShot(src, alt, cap); });
    return b;
  }

  /* ---------- 渲染 ---------- */
  function fillItems(ul, items) {
    items.forEach(function (it) {
      var text = loc(it), li = el('li');
      var m = /^(修复|优化|新增|Fix|Improved?|New|Added)\s*[:：]\s*/i.exec(text);
      if (m) {
        var k = /^(修复|fix)$/i.test(m[1]) ? 'fix' : /^(新增|new|added)$/i.test(m[1]) ? 'add' : 'opt';
        li.appendChild(el('span', 't ' + k, T('t_' + k)));
        text = text.slice(m[0].length);
      }
      li.appendChild(document.createTextNode(text));
      if (it && typeof it === 'object' && it.img) {
        var cap = loc(it.imgAlt);
        li.appendChild(shot(it.img, cap, cap));
      }
      ul.appendChild(li);
    });
  }
  function gallery(imgs) {
    var g = el('div', 'gallery');
    imgs.forEach(function (im) {
      var f = el('figure'), cap = loc(im.caption);
      f.appendChild(shot(im.src, cap, cap));
      if (cap) f.appendChild(el('figcaption', null, cap));
      g.appendChild(f);
    });
    return g;
  }
  function head(r, isNew) {
    var h = el('div', 'rel-head');
    h.appendChild(el('h3', null, r.type === 'app' ? r.version : T('res_name', { r: r.resources })));
    if (isNew) h.appendChild(el('span', 'badge new', T('b_new')));
    h.appendChild(el('span', 'badge' + (r.type === 'app' ? '' : ' dim'), r.type === 'app' ? T('b_app') : T('b_res')));
    h.appendChild(el('span', 'when', r.date));
    return h;
  }
  function sub(r) {
    var t = loc(r.title);
    return el('p', 'ttl', (t ? t + ' · ' : '') + (r.type === 'app' ? T('res_sub_app', { r: r.resources }) : T('res_sub_res')));
  }
  function detail(r) {
    var d = el('div');
    var ul = el('ul'); fillItems(ul, r.items || []);
    d.appendChild(ul);
    if (r.images && r.images.length) d.appendChild(gallery(r.images));
    return d;
  }

  function render() {
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.title = L.version ? '73efootball ' + L.version + ' · ' + T('title').split(' · ')[1] : T('title');
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i], s = T(n.getAttribute('data-i18n'));
      if (n.hasAttribute('data-html')) n.innerHTML = s; else n.textContent = s;
    }
    var btns = document.querySelectorAll('.lang button');
    for (var j = 0; j < btns.length; j++) btns[j].setAttribute('aria-pressed', String(btns[j].getAttribute('data-lang') === lang));
    $('lb-cap').parentNode.setAttribute('aria-label', T('close'));

    $('ver').textContent = L.version;
    $('date').textContent = T('sub', { d: L.date });
    $('apk').href = L.apkUrl;
    $('apk-label').textContent = T('dl', { v: L.version });
    /* QQ 闪传只在中文页显示（英文页不出现任何 QQ 下载入口） */
    var qq = $('qq'), hasQQ = /^https?:\/\//i.test(L.qqUrl || '');
    qq.hidden = $('qq-note').hidden = (lang !== 'zh');
    qq.className = 'btn ghost' + (hasQQ ? '' : ' off');
    if (hasQQ) { qq.href = L.qqUrl; qq.removeAttribute('aria-disabled'); qq.removeAttribute('tabindex'); }
    else { qq.removeAttribute('href'); qq.setAttribute('aria-disabled', 'true'); qq.setAttribute('tabindex', '-1'); }
    $('qq-label').textContent = T(hasQQ ? 'dl_qq' : 'dl_qq_none');
    $('qq-note').textContent = hasQQ ? (loc(L.qqNote) || T('qq_tip')) : T('qq_wait');
    /* Telegram 下载只在非中文页显示（对应中文页的 QQ 闪传）；没填链接就不显示 */
    var hasTG = /^https:\/\/t\.me\//i.test(L.tgUrl || '');
    $('tg-dl').hidden = $('tg-note').hidden = (lang === 'zh' || !hasTG);
    if (hasTG) { $('tg-dl').href = L.tgUrl; }
    $('tg-label').textContent = T('dl_tg');
    $('tg-note').textContent = loc(L.tgNote) || T('tg_tip');
    $('f-apk').textContent = (lang === 'zh' ? '约 ' : '≈ ') + gb(L.apkSizeMB);
    $('f-res').textContent = (lang === 'zh' ? '约 ' : '≈ ') + gb(L.resourcesSizeMB);
    $('f-rv').textContent = L.resources;
    $('sha').textContent = L.sha256;

    /* 手动资源包链接（QQ 闪传 / 网盘）：中文页显示；英文页只显示写了 showEn:true 的 */
    var packs = $('pack-links'); packs.textContent = '';
    var shown = (L.packLinks || []).filter(function (p) { return lang === 'zh' || p.showEn; });
    $('fold-pack').hidden = (lang !== 'zh' && !shown.length);
    /* 下载区里单独的离线资源包（与 APK 分开），只用中文页可见的链接 */
    var hp = shown.filter(function (p) { return /^https?:\/\//i.test(p.url || ''); });
    $('pack-hero').hidden = !hp.length;
    if (hp.length) {
      $('pack-hero-btn').href = hp[0].url;
      $('pack-hero-btn').textContent = T('ph_btn', { l: loc(hp[0].label) });
      $('pack-hero-sub').innerHTML = T('ph_sub', { s: hp[0].sizeMB ? T('pack_size', { s: gb(hp[0].sizeMB) }) : '' });
    }
    if (shown.length) {
      shown.forEach(function (p) {
        var b = el('a', 'btn ghost', T('pack_btn', { l: loc(p.label) }));
        b.href = p.url; b.rel = 'noopener';
        packs.appendChild(b);
        if (p.file) packs.appendChild(el('span', null, p.file + (p.sizeMB ? T('pack_size', { s: gb(p.sizeMB) }) : '')));
      });
    } else {
      packs.appendChild(el('span', null, T('pack_none')));
    }

    var box = $('releases'); box.textContent = '';
    $('rel-count').textContent = T('count', { n: c.releases.length });
    c.releases.forEach(function (r, i) {
      var li = el('li', i === 0 ? 'first' : '');
      if (i < 2) {
        var card = el('div', 'rel');
        card.appendChild(head(r, i === 0));
        card.appendChild(sub(r));
        card.appendChild(detail(r));
        li.appendChild(card);
      } else {
        var d = el('details', 'old'), s = el('summary'), top = el('div', 'rel');
        top.appendChild(head(r, false)); top.appendChild(sub(r));
        s.appendChild(top); d.appendChild(s);
        var body = el('div', 'rel'); body.appendChild(detail(r));
        d.appendChild(body); li.appendChild(d);
      }
      box.appendChild(li);
    });
  }

  function setLang(l) {
    lang = l;
    try { localStorage.setItem('lang', l); } catch (e) {}
    render();
  }
  var lb2 = document.querySelectorAll('.lang button');
  for (var k = 0; k < lb2.length; k++) lb2[k].addEventListener('click', function (e) { setLang(e.currentTarget.getAttribute('data-lang')); });

  /* 跳到页内锚点（顶栏、“查看安装步骤”、“导入说明”等）时，先展开目标所在的折叠区块 */
  function openTo(hash) {
    var t = hash && hash.length > 1 ? document.getElementById(decodeURIComponent(hash.slice(1))) : null;
    for (var n = t; n; n = n.parentNode) if (n.tagName === 'DETAILS') n.open = true;
    return t;
  }
  document.addEventListener('click', function (e) {
    for (var a = e.target; a && a !== document; a = a.parentNode) {
      if (a.tagName === 'A') {
        var h = a.getAttribute('href') || '';
        if (h.charAt(0) === '#' && h.length > 1) openTo(h);
        return;
      }
    }
  });
  window.addEventListener('hashchange', function () { var t = openTo(location.hash); if (t) t.scrollIntoView(); });

  lang = pickLang();
  render();
  if (openTo(location.hash)) setTimeout(function () { var t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }, 0);
})();
